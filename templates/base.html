<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Boba Shop{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="{{ url_for('index') }}">
                <img class="logo" src="{{ url_for('static', filename='images/Logo.png') }}" alt="Logo">
            </a>
            <ul>
                <li><a href="{{ url_for ('menu') }}">Menu</a></li>
                <li><a href="{{ url_for ('invoices') }}">Invoices</a></li>
                <li><a href="{{ url_for ('contact') }}">Contact</a></li>
            </ul>
        </nav>
    </header>  
    
    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Boba Shop</p>
    </footer>
</body>
</html>
